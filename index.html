<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineSync — Watch & Chat Together</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Landing & Room Setup -->
  <div id="landingPage" class="card">
    <div class="brand-header">
      <h1>🎬 CineSync</h1>
      <p>Watch Google Drive movies together in real-time with video & voice chat</p>
    </div>
    
    <div class="input-group">
      <label for="username">Your Name</label>
      <input type="text" id="username" placeholder="e.g. Alex" value="User">
      
      <label for="gdriveLink">Google Drive Video Link</label>
      <input type="text" id="gdriveLink" placeholder="https://drive.google.com/file/d/.../view">
      <span class="hint">Ensure link sharing is set to "Anyone with the link can view"</span>
    </div>

    <div class="actions">
      <button id="btnCreateRoom" class="btn primary">🚀 Create Watch Party</button>
      
      <div class="divider"><span>OR JOIN ROOM</span></div>

      <div class="join-box">
        <input type="text" id="joinCode" placeholder="Enter 6-char Room Code">
        <button id="btnJoinRoom" class="btn secondary">Join</button>
      </div>
    </div>
  </div>

  <!-- Main Theater App -->
  <div id="theaterPage" class="hidden">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="brand">🎬 <span>CineSync</span></div>
      
      <div class="room-pill">
        <span class="dot live"></span>
        <span>Room Code:</span>
        <strong id="roomCodeDisplay">------</strong>
        <button id="btnCopyCode" class="icon-btn-sm" title="Copy Room Link">📋</button>
      </div>

      <div class="media-controls-top">
        <button id="btnToggleMic" class="control-btn active" title="Toggle Microphone">
          <span class="icon">🎙️</span>
          <span class="lbl">Mic ON</span>
        </button>

        <button id="btnToggleCam" class="control-btn active" title="Toggle Camera">
          <span class="icon">📹</span>
          <span class="lbl">Cam ON</span>
        </button>

        <button id="btnLeave" class="control-btn danger" title="Leave Party">
          <span class="icon">🚪</span>
          <span class="lbl">Leave</span>
        </button>
      </div>
    </header>

    <div class="main-layout">
      <!-- Left Stage: Video Player Container -->
      <div class="player-container">
        <!-- Direct Native Video Player (for Direct MP4 / CORS-supported links) -->
        <video id="nativePlayer" controls class="hidden" crossorigin="anonymous" playsinline></video>
        
        <!-- Google Drive Streaming Frame Wrapper (Handles large GDrive files cleanly) -->
        <div id="driveFrameWrap" class="drive-frame-wrap">
          <iframe id="driveIframe" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
          <!-- Synchronized Overlay Controller for Google Drive Player -->
          <div id="syncOverlay" class="sync-overlay">
            <div id="playStateBadge" class="play-state-badge">▶ Ready</div>
            <div class="overlay-controls">
              <button id="btnSyncPlay" class="overlay-btn">▶ Play for All</button>
              <button id="btnSyncPause" class="overlay-btn">⏸ Pause for All</button>
              <button id="btnSyncSeekBack" class="overlay-btn">⏪ -10s</button>
              <button id="btnSyncSeekFwd" class="overlay-btn">⏩ +10s</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Panel: Participants Video Grid & Text Chat -->
      <div class="sidebar">
        <div class="sidebar-section">
          <h3>Participants (<span id="participantCount">1</span>)</h3>
          <div id="videoGrid" class="video-grid">
            <!-- Local User Video -->
            <div class="video-card" id="localVidCard">
              <video id="localVideo" autoplay playsinline muted></video>
              <div class="user-tag">
                <span id="localNameTag">You</span>
                <span class="mic-status" id="localMicTag">🎙️</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Chat Box -->
        <div class="chat-box">
          <div class="chat-header">💬 Live Chat</div>
          <div id="chatMessages" class="messages"></div>
          <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="Type a message..." maxlength="300">
            <button id="btnSendChat">Send</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <!-- PeerJS Engine -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
